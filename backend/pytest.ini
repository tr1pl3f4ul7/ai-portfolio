[pytest]
# Without this, pytest puts tests/ on sys.path rather than backend/, and
# `from app.main import app` fails. Not pyproject.toml, because this project is
# not a distributable package and implying otherwise would be misleading.
pythonpath = .
testpaths = tests

# Live tests are excluded by default, so the everyday run is hermetic and needs
# no key. Opt in with `pytest -m live`.
#
# They must not run concurrently with anything else using the same key:
# GLM-4.7-Flash permits exactly one in-flight request per account, so a parallel
# run would 429 itself and fail for a reason that has nothing to do with the code.
addopts = -m "not live"
markers =
    live: calls the real Z.AI API. Needs ZAI_API_KEY. Run serially.
