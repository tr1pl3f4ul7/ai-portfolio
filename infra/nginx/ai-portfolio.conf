# Reverse proxy for the AI portfolio backend.
#
# Step 5.2: TLS is Cloudflare edge TLS + a Cloudflare Origin CA certificate on
# this VM, in "Full (strict)" mode — not certbot. Cloudflare already terminates
# TLS for visitors on api.ljubenvassilev.com; this origin certificate is only
# for the Cloudflare-edge-to-this-VM leg, which Full Strict requires to be a
# real, validated certificate rather than a self-signed one. The cert/key
# themselves are never in this repo — installed directly on the VM at
# /etc/ssl/cloudflare/ (decision 49).
#
# Port 80 stays open, redirecting to 443, purely for direct http:// requests
# against the VM (e.g. a local health check against the bare IP) — Cloudflare
# itself always connects over 443 once the zone is in Full Strict mode.
#
# Installed by infra/deploy.sh to /etc/nginx/sites-available/ai-portfolio and
# symlinked into sites-enabled, replacing nginx's default site.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Serve on any name — Cloudflare is the only thing that ever connects here
    # directly, and it always presents the right SNI for whichever hostname a
    # visitor requested.
    server_name _;

    ssl_certificate /etc/ssl/cloudflare/api.ljubenvassilev.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.ljubenvassilev.com.key;

    # The app caps its own field sizes, but reject an oversized body at the edge
    # too so nginx buffers do the first filtering before FastAPI ever sees it.
    client_max_body_size 64k;

    # Don't advertise the nginx version in error pages or the Server header.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # --- Client identity ---------------------------------------------------
        # The rate limiter reads X-Real-IP as the trusted client address
        # (decision 32). It MUST be SET from $remote_addr here, overwriting
        # anything the client sent — a value passed through from the request
        # would let a visitor forge their own identity and slip the per-IP cap.
        proxy_set_header X-Real-IP $remote_addr;

        # $proxy_add_x_forwarded_for appends the real peer to any inbound
        # X-Forwarded-For. The app deliberately reads the RIGHTMOST entry (the
        # one written here), so a spoofed left-hand value is inert — but keep
        # the header honest regardless.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # --- Timeouts ----------------------------------------------------------
        # A /chat request waits on a Claude call. 60s is comfortably longer than
        # a Haiku answer takes and short enough that a wedged upstream frees the
        # connection rather than hanging a visitor indefinitely.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Stream the response as it arrives rather than buffering the whole body.
        proxy_buffering off;
    }
}
