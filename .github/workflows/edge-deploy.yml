name: Deploy edge

on:
  push:
    branches: [master]
    paths:
      - "edge/**"
      - ".github/workflows/edge-deploy.yml"

concurrency:
  group: deploy-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Post-deploy smoke test
        # Spam only, deliberately (decision 55) — a clean payload would really
        # forward to the backend: a real Claude triage call, a stored
        # submission, and a real email to LJ, on every single edge deploy.
        # This proves the Worker is live, deployed, and responding correctly
        # without ever touching the backend; it does not re-verify the
        # forward-to-backend path itself, which Step 5.2 already confirmed
        # works and which nothing in edge/ has changed since.
        #
        # A retry loop, not curl's own --retry — that only retries a fixed set
        # of standard HTTP codes (408/429/500/502/503/504), not Cloudflare's
        # own 522/524 a freshly-touched custom domain can transiently return.
        run: |
          payload='{"name":"SEO Expert","email":"promo@cheap-backlinks-seo.biz","message":"BUY NOW!!! Get 10000 backlinks for only $9.99! CASINO CRYPTO FOREX guaranteed profits act now!!!"}'
          for i in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 -X POST https://contact.ljubenvassilev.com \
              -H "Content-Type: application/json" -d "${payload}" 2>/dev/null) && \
              echo "${body}" | grep -q '"received":true' && { echo "${body}"; exit 0; }
            echo "Attempt ${i}/12: not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Worker did not respond correctly in time" >&2
          exit 1
