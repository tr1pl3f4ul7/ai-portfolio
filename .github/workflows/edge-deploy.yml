name: Deploy edge

on:
  push:
    branches: [master]
    paths:
      - "edge/**"
      - ".github/workflows/edge-deploy.yml"

concurrency:
  group: deploy-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Post-deploy smoke test
        # Two assertions, both against the Worker alone — nothing here reaches
        # the VM, spends inference, or emails LJ (decision 55's constraint,
        # still honoured).
        #
        # 1. GET /health proves the Worker is deployed and serving. It is
        #    dependency-free by design and answers before any other logic.
        # 2. A POST with no Turnstile token must be refused with 403. This is
        #    the load-bearing one, and it replaces the old assertion that a spam
        #    payload came back `"received":true` — which decision 69 turned into
        #    a guaranteed failure, since a tokenless request no longer gets that
        #    far.
        #
        # Asserting the 403 is worth more than the receipt ever was: it proves
        # verification is actually ON. If TURNSTILE_SECRET_KEY were missing,
        # turnstile.ts returns `unverifiable` and fails open by design, the
        # request would sail past and get a 200 — so this is what catches an
        # unprotected contact form, which a liveness check alone never would.
        #
        # The payload stays spam so that even in that fail-open case the
        # classifier drops it and nothing is forwarded or emailed.
        #
        # A retry loop, not curl's own --retry — that only retries a fixed set
        # of standard HTTP codes (408/429/500/502/503/504), not Cloudflare's
        # own 522/524 a freshly-touched custom domain can transiently return.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://contact.ljubenvassilev.com/health 2>/dev/null \
              | grep -q '"status":"ok"'; then
              echo "Worker is live."
              break
            fi
            if [ "${i}" -eq 12 ]; then
              echo "Worker did not come up in time" >&2
              exit 1
            fi
            echo "Attempt ${i}/12: not ready yet, retrying in 10s..."
            sleep 10
          done

          payload='{"name":"SEO Expert","email":"promo@cheap-backlinks-seo.biz","message":"BUY NOW!!! Get 10000 backlinks for only $9.99! CASINO CRYPTO FOREX guaranteed profits act now!!!"}'
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -X POST https://contact.ljubenvassilev.com \
            -H "Content-Type: application/json" -d "${payload}")
          if [ "${code}" = "403" ]; then
            echo "Turnstile is enforcing: a tokenless submission was refused."
            exit 0
          fi
          echo "Expected 403 for a submission with no Turnstile token, got ${code}." >&2
          if [ "${code}" = "200" ]; then
            echo "A 200 means the Worker forwarded an unverified submission — the" >&2
            echo "contact form is unprotected. Check TURNSTILE_SECRET_KEY is set:" >&2
            echo "  cd edge && npx wrangler secret put TURNSTILE_SECRET_KEY" >&2
          fi
          exit 1
