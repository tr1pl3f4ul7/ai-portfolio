name: Backend CI

# Runs directly on ubuntu-latest, no container needed — the Docker wrapper
# backend/test/run-tests.sh uses locally exists only because sqlite-vec has
# no wheel matching the local development environment. GitHub's runners are
# Linux x64, where sqlite-vec and torch both install natively (see the
# --extra-index-url already declared in requirements.txt).
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # matches the VM and decision 23 — never test a different minor version

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # pytest.ini defaults to `-m "not live"`, so this run mocks the model
        # entirely and needs no secret. The `live` tests are deliberately not
        # run here: GLM-4.7-Flash permits one in-flight request per account, so
        # two concurrent CI jobs would 429 each other and fail for a reason
        # that has nothing to do with the change under test.
        run: pytest -v
