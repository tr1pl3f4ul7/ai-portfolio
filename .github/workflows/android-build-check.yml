name: Android Build Check

# Verifies the Flutter app still builds for Android — Gradle resolves,
# flutter_local_ai's ML Kit GenAI integration links correctly. Unlike the iOS
# check, this produces a genuinely installable artifact: release builds are
# still signed with the auto-generated debug keystore (see
# android/app/build.gradle.kts — "so `flutter run --release` works"), which
# is fine for confirming the app installs and runs, not for distribution.
# Real Play Store signing arrives at Step 7.4.

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17" # matches android/app/build.gradle.kts's compileOptions

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7" # matches the local dev toolchain
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug-signed release APK
        run: flutter build apk --release

      - name: Upload the APK for inspection
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-signed-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
